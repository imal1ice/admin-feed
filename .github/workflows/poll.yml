name: poll
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "ownerwatch>=0.7.4"
      - name: Poll once
        run: ownerwatch run --once --config ownerwatch.yaml
      - name: Render site
        run: python build.py
      - name: Commit state and site
        run: |
          git config user.name imal1ice
          git config user.email imal1ice@proton.me
          git add -A state alerts.jsonl docs control/blocktimes.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
