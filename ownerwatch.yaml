# admin-feed: ownerwatch config for the public feed. Four chains, one process.
# Logs and reads come from Tenderly's public gateways, which serve full history and were
# cross-checked against the official RPCs (rpc.flashbots.net was dropped: it silently returned
# incomplete logs). State per chain and every alert are committed back by the workflow.
confirmations: 3
start_block: latest
alerts:
  jsonl_path: alerts.jsonl
  min_severity: info
chains:
  - chain_name: ethereum
    rpc_url: "https://mainnet.gateway.tenderly.co"
    probe_rpc_url: "https://mainnet.gateway.tenderly.co"
    explorer_url: "https://etherscan.io"
    max_block_range: 10000
    state_file: state/ethereum.json
